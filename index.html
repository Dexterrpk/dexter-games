<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080810"><meta name="author" content="NeriInfotech"><meta name="description" content="Dexter Games — cubo mágico, xadrez, damas, dominó e quebra-cabeça para jogar local ou online."><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="/assets/base.css"><link rel="stylesheet" href="/assets/pro-ui.css"><title>Dexter Games</title></head><body><main class="shell"><header class="topbar"><div class="brand"><div class="brand-mark">🎮</div><div><small>Dexter Games</small><h1>Jogar</h1></div></div><div class="top-actions"><button class="icon-btn" id="installBtn" hidden aria-label="Instalar app">⬇️</button><button class="icon-btn" id="soundBtn" aria-label="Som">🔊</button></div></header><section class="panel hero"><div class="eyebrow">jogos clássicos • mobile first</div><h2>Escolha seu jogo.</h2><p>Partidas rápidas, local ou online.</p><div class="stats"><span class="pill">🎯 Regras completas</span><span class="pill">🔗 PvP por código</span></div></section><section class="games" aria-label="Jogos"><button class="game-card featured" data-href="/cube.html"><div><div class="icon">🧩</div><strong>Cubo Mágico 3×3</strong><small>3D, gestos e solver.</small></div><span class="tag">JOGAR</span></button><button class="game-card" data-href="/chess.html"><div><div class="icon">♟️</div><strong>Xadrez</strong><small>Local ou PvP.</small></div><span class="tag">PVP</span></button><button class="game-card" data-href="/checkers.html"><div><div class="icon">🔴</div><strong>Damas Brasileiras</strong><small>Regra brasileira.</small></div><span class="tag">PVP</span></button><button class="game-card" data-href="/domino.html"><div><div class="icon">🁫</div><strong>Dominó</strong><small>Dupla-seis 1×1.</small></div><span class="tag">PVP</span></button><button class="game-card" data-href="/puzzle.html"><div><div class="icon">🧠</div><strong>Quebra-cabeça</strong><small>Foto própria e Puzzle Race.</small></div><span class="tag">JOGAR</span></button></section></main><script src="/js/branding.js" defer></script><script type="module">import{wireSoundButton,sfx}from'/js/audio.js';wireSoundButton(document.getElementById('soundBtn'));document.querySelectorAll('[data-href]').forEach(b=>b.addEventListener('click',()=>{sfx.tap();setTimeout(()=>location.href=b.dataset.href,45)}));let deferred;const install=document.getElementById('installBtn');window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;install.hidden=false});install.addEventListener('click',async()=>{if(!deferred)return;deferred.prompt();await deferred.userChoice;deferred=null;install.hidden=true});if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});</script></body></html>
